<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Guest Intelligence</title>
 
<script src="https://live.zwidgets.com/js-sdk/1.2/ZohoEmbededAppSDK.min.js"></script>
 
<style>
body{
font-family:Segoe UI,Arial;
background:#f5f7fa;
padding:16px;
}
.card{
background:#fff;
padding:18px;
border-radius:10px;
}
button{
width:100%;
padding:12px;
background:#0b5cab;
color:#fff;
border:none;
border-radius:6px;
cursor:pointer;
}
#loading{
display:none;
margin-top:15px;
}
#error{
color:red;
margin-top:15px;
}
#output{
margin-top:20px;
}
</style>
 
</head>
 
<body>
 
<div class="card">
 
<h2>🏨 Guest Intelligence</h2>
 
<button onclick="analyzeGuest()">
✨ Analyze Guest
</button>
 
<div id="loading">
Analyzing...
</div>
 
<div id="error"></div>
 
<div id="output"></div>
 
</div>
 
<script>
 
let contactId = "";
 
ZOHO.embeddedApp.on("PageLoad", function(data){
 
console.log("Page Load:", data);
 
contactId = data.EntityId;
 
});
 
ZOHO.embeddedApp.init();


async function analyzeGuest(){
 
loading.style.display = "block";
error.innerHTML = "";
output.innerHTML = "";
 
try{
 
console.log("Calling Catalyst...");
console.log("Contact ID:", contactId);
 //Replace with your Catalyst serverless function URL
const response = await fetch(
"https://****.catalystserverless.com/server/guest360",
{
method: "POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify({
contactId:contactId
})
}
);
 
console.log("HTTP Status:", response.status);
console.log("HTTP OK:", response.ok);
 
console.log(
"Headers:",
[...response.headers.entries()]
);
 
const text = await response.text();
 
console.log("Raw Response:", text);
 
loading.style.display = "none";
 
if(!response.ok){
 
error.innerHTML =
"HTTP Error : " + response.status;
 
return;
 
}
 
let data;
 
try{
 
data = JSON.parse(text);
 
}
catch(parseError){
 
console.error(parseError);
 
error.innerHTML =
"Invalid JSON returned from server.";
 
return;
 
}
 
console.log("Parsed Response:", data);
 
if(data.success){
 
output.innerHTML = data.html;
 
}
else{
 
error.innerHTML =
data.error ||
JSON.stringify(data,null,2);
 
}
 
}
catch(e){
 
loading.style.display = "none";
 
console.error("Fetch Error:", e);
 
error.innerHTML = e.message;
 
}
 
}
 
</script>
 
</body>
</html>
